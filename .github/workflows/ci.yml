name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual runs. This is the only way the deploy job runs (see below).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Linting & Code Quality
  # ===========================================================================
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned: new ruff releases add default rules, which would fail this job
      # without any change to the code. Bump deliberately.
      - name: Install linters
        run: pip install ruff==0.16.9

      - name: Run Ruff lint
        run: ruff check services/

      - name: Run Ruff format check
        run: ruff format --check services/

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities for now

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ===========================================================================
  # Python Tests
  # ===========================================================================
  test-python:
    name: 🧪 Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [phenotype-nlp, governance-auditor]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest tests/ -v --cov=. --cov-report=xml

      # Optional: needs a CODECOV_TOKEN secret, and never fails the build.
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ===========================================================================
  # R Tests
  # ===========================================================================
  test-r:
    name: 🧪 R Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [clinical-ingestion, genomic-bridge]
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c("testthat", "dplyr", "tibble", "stringr", "checkmate", "data.table"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Run R tests
        working-directory: services/${{ matrix.service }}
        run: |
          testthat::test_dir("tests", reporter = "summary")
        shell: Rscript {0}

  # ===========================================================================
  # Build Docker Images
  # ===========================================================================
  # Pushes images only after the unit and integration tests pass.
  build:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [integration, test-r]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [phenotype-nlp, governance-auditor, clinical-ingestion, genomic-bridge]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Integration Tests
  # ===========================================================================
  # Builds the images from source with docker compose, so it does not need the
  # pushed images and also runs on pull requests.
  integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test-python]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d --build
        env:
          DOCKER_BUILDKIT: 1

      - name: Wait for services
        run: |
          for port in 8001 8002; do
            echo "Waiting for the service on port $port..."
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
                echo "Service on port $port is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Timed out waiting for the service on port $port"
                docker compose -f docker-compose.ci.yml ps
                docker compose -f docker-compose.ci.yml logs
                exit 1
              fi
              echo "Attempt $i/30, waiting..."
              sleep 10
            done
          done

      - name: Run integration tests
        run: |
          set -euo pipefail

          # phenotype-nlp: the image ships en_core_web_sm, so that is what should load
          curl -fsS http://localhost:8001/health | tee nlp_health.json
          jq -e '.spacy_pipeline == "en_core_web_sm"' nlp_health.json

          curl -fsS -X POST http://localhost:8001/extract/vte \
            -H "Content-Type: application/json" \
            -d '{"patient_id":"test","encounter_id":"e1","text_content":"Patient has PE"}' | tee vte_positive.json
          jq -e '.has_vte == true and .evidence == ["PE"]' vte_positive.json

          curl -fsS -X POST http://localhost:8001/extract/vte \
            -H "Content-Type: application/json" \
            -d '{"patient_id":"test","encounter_id":"e2","text_content":"No evidence of PE."}' | tee vte_negated.json
          jq -e '.has_vte == false and .status == "NEGATIVE_VTE"' vte_negated.json

          # governance-auditor: the VLM call is mocked, and the service must say so
          curl -fsS http://localhost:8002/health | tee auditor_health.json
          jq -e '.vlm_mocked == true' auditor_health.json

          printf 'synthetic test page\n' > page.txt
          curl -fsS -X POST http://localhost:8002/audit/document -F "file=@page.txt" | tee audit.json
          jq -e '.mocked == true and .is_safe == false' audit.json

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ===========================================================================
  # Deploy (Manual Trigger)
  # ===========================================================================
  # There is no cluster behind this repository. The job only runs when someone
  # starts the workflow by hand on main (Actions > CI/CD Pipeline > Run workflow)
  # and has added a base64-encoded KUBECONFIG repository secret.
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::No KUBECONFIG secret is set, so there is no cluster to deploy to."
            exit 1
          fi
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy to Kubernetes
        run: kubectl apply -k infrastructure/k8s/base/

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/phenotype-nlp -n gut-reaction
          kubectl rollout status deployment/governance-auditor -n gut-reaction
